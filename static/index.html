<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ship's Surgeon — Intake Articles</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%98%A0</text></svg>">
<style>
  :root {
    --wood-dark: #2e1c0f;
    --wood: #4a2c17;
    --parchment: #ece0c4;
    --ink: #2b1c0e;
    --ink-faded: #6d5940;
    --gold: #c08a2e;
    --rope: #b99760;
    --blood: #8a2b1c;
    --sea: #1d4b5a;
  }
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0 0 4rem;
    color: var(--ink);
    font: 16px/1.55 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    background-color: var(--wood);
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 2px, rgba(0,0,0,0) 2px 15%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, rgba(0,0,0,.13) 1px 3px, rgba(0,0,0,0) 3px 9px),
      linear-gradient(180deg, var(--wood-dark), var(--wood) 40%, var(--wood-dark));
  }
  .display { font-family: Luminari, Papyrus, "Iowan Old Style", Georgia, serif; }

  /* ---------------- the plank (progress) ---------------- */
  .hud {
    position: sticky; top: 0; z-index: 10;
    padding: .9rem 1rem .7rem;
    background: linear-gradient(180deg, rgba(20,12,6,.97), rgba(20,12,6,.86));
    border-bottom: 2px solid var(--wood-dark);
    box-shadow: 0 6px 18px rgba(0,0,0,.45);
  }
  .track {
    position: relative;
    max-width: 820px;
    margin: 0 auto;
    height: 64px;
  }
  .ship {
    position: absolute; left: 0; bottom: 6px;
    font-size: 1.9rem; line-height: 1;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.6));
  }
  .board {
    position: absolute;
    left: 2.4rem; right: 2.2rem; bottom: 14px;
    height: 13px;
    background-color: #7a4a22;
    background-image: repeating-linear-gradient(90deg,
      rgba(0,0,0,.34) 0 2px, rgba(255,255,255,.07) 2px 9px, rgba(0,0,0,0) 9px 26px);
    border: 2px solid var(--wood-dark);
    border-radius: 2px;
    box-shadow: 0 3px 6px rgba(0,0,0,.5);
  }
  .sea {
    position: absolute;
    left: 2.4rem; right: 0; bottom: 0;
    height: 14px;
    overflow: hidden;
    color: rgba(255,255,255,.5);
    font-size: .8rem;
  }
  .sea .shark { position: absolute; bottom: -2px; right: 1.2rem; font-size: 1rem; animation: lurk 3.5s ease-in-out infinite; }
  @keyframes lurk {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    50% { transform: translateX(-14px) rotate(-6deg); }
  }
  .walker {
    position: absolute;
    bottom: 22px;
    font-size: 1.6rem; line-height: 1;
    transform: translateX(-50%);
    transition: left .55s cubic-bezier(.34,1.3,.64,1);
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.6));
  }
  .walker.falling { animation: fall 1.1s ease-in forwards; }
  @keyframes fall {
    0% { bottom: 22px; transform: translateX(-50%) rotate(0deg); }
    100% { bottom: -34px; transform: translateX(-50%) rotate(220deg); opacity: .15; }
  }
  .caption {
    max-width: 820px;
    margin: .15rem auto 0;
    display: flex; justify-content: space-between; gap: 1rem;
    font-size: .8rem; color: var(--rope);
    text-transform: uppercase; letter-spacing: .08em;
  }
  .caption .doom { font-style: italic; text-transform: none; letter-spacing: 0; color: #d8b98a; }

  /* ---------------- live mic level ---------------- */
  .mic {
    max-width: 820px;
    margin: .45rem auto 0;
    display: flex; align-items: center; gap: .6rem;
    font-size: .72rem; letter-spacing: .06em; text-transform: uppercase;
    color: var(--rope);
  }
  .mic-label { white-space: nowrap; }
  .mic-bar {
    position: relative;
    flex: 1; height: 10px;
    background: rgba(0,0,0,.5);
    border: 1px solid rgba(185,151,96,.45);
    border-radius: 5px;
    overflow: hidden;
  }
  .mic-fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0;
    background: linear-gradient(90deg, #2f6d4a, #c8a33a 62%, #c8401f);
    transition: width .05s linear;
  }
  .mic-peak {
    position: absolute; top: 0; bottom: 0; width: 2px;
    background: #fff; opacity: .75; left: 0;
    transition: left .25s ease-out;
  }
  .mic-tick {
    position: absolute; top: -3px; bottom: -3px; width: 2px;
    background: var(--blood);
    box-shadow: 0 0 0 1px rgba(255,255,255,.35);
    left: 0;
  }
  .mic-read { white-space: nowrap; min-width: 21ch; text-align: right; font-variant-numeric: tabular-nums; }
  .mic[data-state="over"] .mic-read { color: #6fdc8c; font-weight: 700; }
  .mic[data-state="under"] .mic-read { color: #e8b04b; }
  .mic[data-state="idle"] { opacity: .5; }
  .mic[data-state="calibrating"] .mic-read { color: #d8b98a; font-style: italic; }

  @media (max-width: 620px) {
    .mic { font-size: .64rem; gap: .4rem; }
    .mic-read { min-width: 13ch; }
    .mic-label { display: none; }
  }

  /* ---------------- the card ---------------- */
  main { max-width: 620px; margin: 2rem auto 0; padding: 0 1rem; }
  .card {
    background-color: var(--parchment);
    background-image:
      radial-gradient(ellipse at 15% 10%, rgba(139,105,58,.16), transparent 55%),
      radial-gradient(ellipse at 85% 85%, rgba(139,105,58,.2), transparent 55%);
    border: 3px solid var(--wood-dark);
    border-radius: 3px;
    padding: 2rem 1.9rem 1.6rem;
    box-shadow: 0 0 0 6px rgba(185,151,96,.22), 0 14px 40px rgba(0,0,0,.55);
    animation: deal .3s ease-out;
  }
  @keyframes deal { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .step-no { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faded); }
  h1 { font-size: 1.55rem; margin: .35rem 0 .3rem; line-height: 1.25; }
  .plain { font-style: italic; color: var(--ink-faded); font-size: .9rem; margin: 0 0 1.3rem; }

  .answer {
    min-height: 3.4rem;
    padding: .7rem .8rem;
    font-size: 1.15rem;
    background: rgba(255,253,245,.8);
    border: 2px solid var(--ink-faded);
    border-radius: 2px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .answer.empty { color: rgba(43,28,14,.33); font-style: italic; font-size: 1rem; }
  .answer.hot { outline: 3px solid var(--blood); outline-offset: 1px; background: rgba(255,244,205,.95); }
  .answer .interim { color: var(--ink-faded); font-style: italic; }
  .answer .parsed { display: block; font-size: .8rem; color: var(--ink-faded); font-style: italic; margin-top: .3rem; }

  .choices { display: flex; flex-wrap: wrap; gap: .45rem; }
  .choice {
    padding: .4rem .7rem;
    font-size: .92rem;
    background: rgba(255,253,245,.7);
    border: 2px solid var(--ink-faded);
    border-radius: 1.4rem;
    color: rgba(43,28,14,.62);
    cursor: default;
    user-select: none;
  }
  .choice.on {
    background: var(--blood);
    border-color: var(--wood-dark);
    color: #f7ecd2;
    font-weight: 700;
  }

  /* scream gauge */
  .pips { display: flex; gap: 4px; margin-bottom: .5rem; }
  .pip {
    width: 1.5rem; height: 1.7rem;
    display: grid; place-items: center;
    font-size: 1.1rem;
    color: rgba(43,28,14,.2);
    border-bottom: 3px solid var(--ink-faded);
    transition: color .08s linear, transform .08s linear;
  }
  .pip.lit { color: var(--blood); transform: scale(1.16); }
  .gauge-val { font-size: 1.6rem; font-weight: 700; }
  .gauge-val .of { font-size: .9rem; font-weight: 400; color: var(--ink-faded); }
  .vu { height: 7px; background: rgba(43,28,14,.14); border-radius: 4px; overflow: hidden; margin: .7rem 0 0; }
  .vu span { display: block; height: 100%; width: 0; background: var(--blood); transition: width .05s linear; }

  /* ---------------- buttons & notes ---------------- */
  .acts { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1.3rem 0 0; }
  button {
    font: 600 .82rem/1.2 "Iowan Old Style", Georgia, serif;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: #f7ecd2;
    border: 2px solid var(--wood-dark);
    border-radius: 2rem;
    padding: .62rem 1.05rem;
    cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.16);
  }
  .speak { background: linear-gradient(180deg, #6b3f20, #45260f); }
  .speak:hover { background: linear-gradient(180deg, #7d4a26, #522d13); }
  .holler { background: linear-gradient(180deg, #8a2b1c, #5e1a10); }
  .holler:hover { background: linear-gradient(180deg, #a33124, #6f1f14); }
  button:disabled { opacity: .4; cursor: not-allowed; animation: none !important; }
  button[data-live="1"] { animation: pulse 1.05s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(200,64,31,.75); }
    50% { box-shadow: 0 0 0 .55rem rgba(200,64,31,0); }
  }

  .note { min-height: 1.4em; margin: .9rem 0 0; font-style: italic; color: var(--blood); font-size: .92rem; }
  .gate {
    margin: 1.1rem 0 0;
    padding: .65rem .8rem;
    border-left: 4px solid var(--blood);
    background: rgba(138,43,28,.08);
    font-size: .88rem;
  }
  .gate b { text-transform: uppercase; letter-spacing: .05em; }

  /* ---------------- intro & end ---------------- */
  .hero { text-align: center; }
  .hero .skull { font-size: 2.6rem; display: block; line-height: 1; }
  .hero h1 { font-size: 1.9rem; text-transform: uppercase; letter-spacing: .03em; }
  .rules { text-align: left; margin: 1.4rem 0 0; padding: 0; list-style: none; font-size: .95rem; }
  .rules li { margin-bottom: .6rem; padding-left: 1.7rem; position: relative; }
  .rules li::before { content: "☠"; position: absolute; left: 0; color: var(--blood); }
  .nosupport { margin: 1.2rem 0 0; padding: .7rem .85rem; border: 2px dashed var(--blood); color: var(--blood); font-size: .88rem; }
  .summary { margin: 1.2rem 0 0; font-size: .9rem; border-top: 2px solid var(--ink-faded); }
  .summary div { display: flex; justify-content: space-between; gap: 1rem; padding: .35rem 0; border-bottom: 1px dotted var(--ink-faded); }
  .summary .k { color: var(--ink-faded); font-style: italic; }
  .summary .v { font-weight: 700; text-align: right; }

  footer { max-width: 620px; margin: 1.3rem auto 0; padding: 0 1rem; text-align: center; font-size: .82rem; color: var(--rope); }
  footer a { color: #ded0af; }

  @media (max-width: 520px) {
    .card { padding: 1.4rem 1.1rem; }
    h1 { font-size: 1.3rem; }
    .pip { width: 1.15rem; font-size: .9rem; }
  }
</style>
</head>
<body>

<div class="hud">
  <div class="track">
    <span class="ship">🚢</span>
    <div class="board"></div>
    <div class="sea"><span class="shark">🦈</span></div>
    <span class="walker" id="walker">🚶</span>
  </div>
  <div class="caption">
    <span id="progress-text">Step 0</span>
    <span class="doom" id="doom-text">still aboard</span>
  </div>
  <div class="mic" id="mic" data-state="idle">
    <span class="mic-label">🎚 Mic</span>
    <div class="mic-bar">
      <span class="mic-fill" id="mic-fill"></span>
      <span class="mic-peak" id="mic-peak"></span>
      <i class="mic-tick" id="mic-tick" title="scream threshold"></i>
    </div>
    <span class="mic-read" id="mic-read">silent — nothin' open</span>
  </div>
</div>

<main><div class="card" id="card"></div></main>
<footer>☠ All souls aboard: <a href="/api/intake">/api/intake</a> ☠</footer>

<script>
/* ==================================================================
 * Articles of the Ship's Surgeon — one question per plank-step.
 *
 * Nothing here can be typed: there is not a single editable element on
 * the page. Written answers arrive by dictation, the 0-10 scales by the
 * length of a scream, and the ONLY way forward is to scream.
 * ================================================================== */

const CONDITIONS = [
  "Arthritis", "Diabetes", "Kidney disease",
  "Asthma", "Glaucoma", "Seizures",
  "Cancer", "Heart disease", "Stroke",
  "COPD / emphysema", "High blood pressure", "Thyroid disease",
  "Depression / anxiety", "High cholesterol",
];

const CONDITION_ALIASES = {
  "COPD / emphysema": ["copd", "emphysema", "black lung"],
  "High blood pressure": ["blood pressure", "hypertension"],
  "High cholesterol": ["cholesterol"],
  "Depression / anxiety": ["depression", "anxiety", "melancholy"],
  "Heart disease": ["heart"], "Kidney disease": ["kidney"],
  "Thyroid disease": ["thyroid"], "Diabetes": ["diabetes", "sugar"],
  "Arthritis": ["arthritis", "creaky bones"], "Glaucoma": ["glaucoma", "eye pressure"],
  "Seizures": ["seizure", "fits"], "Cancer": ["cancer"],
  "Stroke": ["stroke"], "Asthma": ["asthma"],
};

/* One question per section, in the order the plank runs. */
const STEPS = [
  { key: "filled_out_by", kind: "text", q: "Who holds the quill?",
    plain: "Filled out by, if not the patient", say: 'Say "just me" if it\'s yerself' },
  { key: "name", kind: "text", q: "What name do ye answer to?",
    plain: "Patient name — the one question we cannot sail without", required: true },
  { key: "date_of_birth", kind: "date", q: "What day were ye launched?",
    plain: "Date of birth", say: 'Say it like "June 2nd 1943"' },
  { key: "address", kind: "text", q: "Where do ye drop anchor?", plain: "Address" },
  { key: "phone", kind: "text", q: "How do we hail ye?", plain: "Phone number" },
  { key: "insurance", kind: "text", q: "What colors do ye fly?", plain: "Insurance" },
  { key: "member_id", kind: "text", q: "What mark is on yer papers?", plain: "Member ID" },
  { key: "emergency_contact", kind: "text", q: "Who's told if ye're lost at sea?",
    plain: "Emergency contact — name, relationship, phone" },

  { key: "reason_for_visit", kind: "textarea", q: "What ails ye?",
    plain: "Reason for visit — the whole of it, in yer own words" },
  { key: "current_medications", kind: "textarea", q: "What potions do ye swallow?",
    plain: "Current medications — include over-the-counter, vitamins, eye drops, inhalers" },
  { key: "allergies", kind: "text", q: "What makes ye break out in barnacles?",
    plain: "Allergies", say: 'Say "none" if none' },

  { key: "pain", kind: "scale", q: "How bad is the agony?",
    plain: "Pain at its worst this past week" },
  { key: "itch", kind: "scale", q: "How fierce is the itch?",
    plain: "Itching — skin crawlin' with barnacles" },
  { key: "nausea", kind: "scale", q: "How green about the gills?",
    plain: "Nausea and queasiness" },
  { key: "fatigue", kind: "scale", q: "How deep are the doldrums?",
    plain: "Tiredness — no wind in yer sails" },
  { key: "sleep_trouble", kind: "scale", q: "How restless are yer nights?",
    plain: "Trouble sleeping" },
  { key: "stiffness", kind: "scale", q: "How rusted are yer joints?",
    plain: "Stiffness — how hard it is to get movin'" },
  { key: "breathlessness", kind: "scale", q: "How short o' wind are ye?",
    plain: "Breathlessness" },
  { key: "low_spirits", kind: "scale", q: "How low are yer spirits?",
    plain: "Mood — how low ye've been feelin'" },
  { key: "interference", kind: "scale", q: "Can ye still haul rope?",
    plain: "How much all this keeps ye from daily life" },

  { key: "past_conditions", kind: "choices", multi: true, options: CONDITIONS,
    aliases: CONDITION_ALIASES, q: "What curses have ye carried?",
    plain: "Past conditions", say: "Name as many as ye like, all in one breath" },
  { key: "past_surgeries", kind: "textarea", q: "When has the surgeon cut ye open?",
    plain: "Past surgeries — procedure and year" },
  { key: "family_history", kind: "textarea", q: "What runs in yer bloodline?",
    plain: "Family history — parents, siblings, children: cancer, diabetes, heart disease, stroke, glaucoma" },

  { key: "tobacco", kind: "choices", options: ["Never", "Former", "Current"],
    q: "What of pipe smoke?", plain: "Tobacco" },
  { key: "alcohol", kind: "choices", options: ["None", "Occasional", "Daily"],
    q: "What of grog?", plain: "Alcohol" },
  { key: "drugs", kind: "choices", options: ["No", "Yes"],
    q: "Any other mischief?", plain: "Recreational drugs" },

  { key: "signature", kind: "text", q: "Make yer mark.",
    plain: "Signature — say yer name; if ye're not the patient, say yer relationship too" },
];

const SCALE_KEYS = STEPS.filter((s) => s.kind === "scale").map((s) => s.key);

/* ---------------- state ---------------- */
const answers = {};                 // key -> string
const chosen = {};                  // key -> array of options
const ratings = {};                 // key -> {value, method, seconds}
let index = -1;                     // -1 = the intro card
let submitted = false;

const card = document.getElementById("card");
const walker = document.getElementById("walker");
const progressText = document.getElementById("progress-text");
const doomText = document.getElementById("doom-text");

const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
const AudioContextAPI = window.AudioContext || window.webkitAudioContext;
const canHear = !!(SpeechRecognitionAPI && AudioContextAPI
                   && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

/* ---------------- the plank HUD ---------------- */
const DOOM = [
  "still aboard", "a long walk ahead", "the boards creak",
  "past the point of turnin' back", "the sharks take notice",
  "one pace from the edge", "nothin' below but sea",
];

function paintPlank() {
  const total = STEPS.length;
  const done = Math.max(0, index);
  const fraction = total ? done / total : 0;
  walker.style.left = `calc(2.4rem + ${fraction} * (100% - 4.6rem))`;

  if (index < 0) {
    progressText.textContent = "On deck";
    doomText.textContent = DOOM[0];
    return;
  }
  progressText.textContent = `Step ${index + 1} of ${total}`;
  const remaining = total - index - 1;
  doomText.textContent = remaining === 0 ? "nothin' below but sea"
    : remaining === 1 ? "one pace from the edge"
    : DOOM[Math.min(DOOM.length - 2, 1 + Math.floor(fraction * 4))];
}

/* ---------------- scream detection ---------------- */
const FLOOR = 0.045;         // quietest thing that counts as a holler
const CEILING = 0.18;        // loudest threshold we'll ever demand (~−15 dBFS) — a
                             // scream can always win; one transient in calibration
                             // must never make the gate mathematically unreachable
const SILENCE_MS = 500;      // this much quiet ends a scream
const ADVANCE_MS = 250;      // this much accumulated noise counts as "let me through"
const DIP_MS = 100;          // a dip shorter than this doesn't break a holler
const WAIT_MS = 8000;        // give up waiting for a holler
const MAX_SECONDS = 10;      // top of every scale
const CALIBRATE_MS = 500;    // learn the room afore judgin' a holler
const WARMUP_MS = 100;       // a fresh stream opens with digital silence — skip it
const ROOM_MULTIPLE = 8;     // a scream must top the room's MEDIAN noise by this much
const RETRY_MS = 500;        // breather between listen attempts, so nothin' spins hot

/* ---------------- the level meter in the HUD ---------------- */
const METER_TOP = 0.4;           // RMS that fills the bar
const micBox = document.getElementById("mic");
const micFill = document.getElementById("mic-fill");
const micPeak = document.getElementById("mic-peak");
const micTick = document.getElementById("mic-tick");
const micRead = document.getElementById("mic-read");

const asPercent = (rms) => `${Math.max(0, Math.min(100, (rms / METER_TOP) * 100))}%`;
const asDb = (rms) => (rms > 0 ? `${(20 * Math.log10(rms)).toFixed(0)} dB` : "−∞ dB");

function paintMeter({ level = 0, threshold = null, peak = null, state = "idle", label = null }) {
  micBox.dataset.state = state;
  micFill.style.width = asPercent(level);
  if (peak !== null) micPeak.style.left = asPercent(peak);
  if (threshold !== null) {
    micTick.style.left = asPercent(threshold);
    micTick.style.display = "block";
  } else {
    micTick.style.display = "none";
  }
  if (label !== null) { micRead.textContent = label; return; }
  if (state === "idle") { micRead.textContent = "silent — nothin' open"; return; }
  const over = threshold !== null && level >= threshold;
  micRead.textContent = `${level.toFixed(3)} (${asDb(level)}) ${over ? "▲ loud enough" : "▽ too quiet"}`;
}

function resetMeter() {
  paintMeter({ level: 0, threshold: null, peak: 0, state: "idle" });
}

class Screamer {
  constructor() { this.token = 0; this.stream = null; this.context = null; this.source = null; }

  get live() { return this.stream !== null; }

  /* RMS of whatever the mic is hearing right now. */
  reader(analyser) {
    const buffer = new Float32Array(analyser.fftSize);
    return () => {
      analyser.getFloatTimeDomainData(buffer);
      let sum = 0;
      for (const sample of buffer) sum += sample * sample;
      return Math.sqrt(sum / buffer.length);
    };
  }

  async open() {
    if (!this.context) this.context = new AudioContextAPI();
    if (this.context.state === "suspended") await this.context.resume();
    this.stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    });
    const analyser = this.context.createAnalyser();
    analyser.fftSize = 1024;
    this.source = this.context.createMediaStreamSource(this.stream);
    this.source.connect(analyser);
    return analyser;
  }

  stop() {
    this.token++;
    if (this.source) {
      this.source.disconnect?.();
      this.source = null;
    }
    if (this.stream) {
      for (const track of this.stream.getTracks()) track.stop();
      this.stream = null;
    }
    resetMeter();
  }

  /* mode "advance": resolve as soon as a real holler is heard.
   * mode "measure": resolve with how many seconds they held it. */
  async listen({ mode, onLevel, onArmed, onHold, onFail }) {
    this.stop();
    const mine = ++this.token;
    const alive = () => this.token === mine;

    let analyser;
    try {
      analyser = await this.open();
    } catch (error) {
      onFail(error && error.name === "NotAllowedError"
        ? "Ye must let the ship listen — allow the microphone, then holler."
        : "No microphone aboard. This form has no other door.");
      return null;
    }
    if (!alive()) return null;

    const level = this.reader(analyser);

    // Learn the room, so a noisy waiting room isn't mistaken for a scream.
    // Median, not max: one transient must not swing the threshold. The first
    // WARMUP_MS of a fresh stream is digital silence, so it's discarded.
    const calStart = performance.now();
    const samples = [];
    while (performance.now() - calStart < CALIBRATE_MS && alive()) {
      const now = level();
      if (performance.now() - calStart >= WARMUP_MS) samples.push(now);
      paintMeter({ level: now, state: "calibrating", label: "learnin' the room…" });
      await new Promise(requestAnimationFrame);
    }
    if (!alive()) return null;
    samples.sort((a, b) => a - b);
    const room = samples.length ? samples[Math.floor(samples.length / 2)] : 0;
    const threshold = Math.min(CEILING, Math.max(FLOOR, room * ROOM_MULTIPLE));
    onArmed();

    const armedAt = performance.now();
    let prevTick = armedAt;
    let loudMs = 0;                    // advance mode: loud time accumulated
    let start = null;                  // measure mode: when the scream began
    let quietSince = null;
    let peak = 0;

    while (alive()) {
      await new Promise(requestAnimationFrame);
      if (!alive()) return null;
      const now = performance.now();
      const dt = now - prevTick;
      prevTick = now;
      const loudness = level();
      peak = Math.max(peak, loudness);
      const loud = loudness >= threshold;
      paintMeter({ level: loudness, threshold, peak, state: loud ? "over" : "under" });
      if (onLevel) onLevel(loudness);

      if (mode === "advance") {
        // Real voices dip: accumulate loud time, and only a sustained quiet
        // spell (DIP_MS) resets the count — so a cough still won't do it.
        if (loud) { loudMs += dt; quietSince = null; }
        else {
          if (quietSince === null) quietSince = now;
          if (now - quietSince >= DIP_MS) loudMs = 0;
          if (loudMs === 0 && now - armedAt > WAIT_MS) {
            onFail("Heard naught but wind. Holler again."); this.stop(); return null;
          }
        }
        if (loudMs >= ADVANCE_MS) { this.stop(); return loudMs / 1000; }
        continue;
      }

      // measure mode
      if (start === null) {
        if (loud) { start = now; quietSince = null; }
        else if (now - armedAt > WAIT_MS) { onFail("Heard naught but wind. Holler again."); this.stop(); return null; }
        continue;
      }
      const held = (now - start) / 1000;
      if (onHold) onHold(held);
      if (held >= MAX_SECONDS) { this.stop(); return MAX_SECONDS; }
      if (loud) quietSince = null;
      else {
        if (quietSince === null) quietSince = now;
        if (now - quietSince >= SILENCE_MS) { this.stop(); return (quietSince - start) / 1000; }
      }
    }
    return null;
  }
}
const screamer = new Screamer();

/* ---------------- dictation (one field at a time) ---------------- */
class Dictation {
  constructor() { this.recognition = null; }
  get live() { return this.recognition !== null; }

  stop() {
    if (!this.recognition) return;
    const recognition = this.recognition;
    this.recognition = null;
    try { recognition.stop(); } catch { /* already closed */ }
  }

  /* Resolves with the final transcript, or null if nothing was heard.
   * onOpen fires when the mic is actually capturing (onaudiostart lands
   * ~270ms after start()) — prompt the user then, not before, or their
   * first word gets clipped. */
  listen({ onInterim, onFail, onOpen }) {
    this.stop();
    return new Promise((resolve) => {
      const recognition = new SpeechRecognitionAPI();
      recognition.lang = "en-US";
      recognition.continuous = false;
      recognition.interimResults = true;
      this.recognition = recognition;
      let heard = null;

      recognition.onaudiostart = () => { if (onOpen) onOpen(); };
      recognition.onresult = (event) => {
        let interim = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const result = event.results[i];
          if (result.isFinal) heard = (heard ? `${heard} ` : "") + result[0].transcript.trim();
          else interim += result[0].transcript;
        }
        if (interim && onInterim) onInterim(interim);
      };
      recognition.onerror = (event) => {
        if (event.error === "no-speech") onFail("Heard naught. Try again.");
        else if (event.error === "not-allowed" || event.error === "service-not-allowed")
          onFail("Ye must let the ship listen — allow the microphone.");
        else onFail(`Trouble hearin' ye: ${event.error}`);
      };
      recognition.onend = () => {
        if (this.recognition === recognition) this.recognition = null;
        resolve(heard);
      };
      try { recognition.start(); } catch { onFail("Couldn't open yer microphone."); resolve(null); }
    });
  }
}
const dictation = new Dictation();

/* ---------------- turning speech into answers ---------------- */
function normalize(text) {
  return text.toLowerCase().replace(/[.,!?;:]/g, " ").replace(/\s+/g, " ").trim();
}

function spokenDate(spoken) {
  const cleaned = spoken.replace(/(\d+)(st|nd|rd|th)/gi, "$1");
  const parsed = new Date(cleaned);
  if (isNaN(parsed.getTime())) return null;
  return new Date(parsed.getTime() - parsed.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}

function matchChoices(step, spoken) {
  const said = normalize(spoken);
  const hits = [];
  for (const option of step.options) {
    const needles = [option, ...((step.aliases && step.aliases[option]) || [])];
    if (needles.some((needle) => said.includes(normalize(needle)))) hits.push(option);
  }
  return hits;
}

/* ---------------- rendering ---------------- */
function el(html) {
  const wrap = document.createElement("div");
  wrap.innerHTML = html.trim();
  return wrap.firstElementChild;
}

function renderIntro() {
  card.innerHTML = `
    <div class="hero">
      <span class="skull display">☠</span>
      <h1 class="display">Articles of the Ship's Surgeon</h1>
      <p class="plain">Signed afore ye are hauled below deck</p>
    </div>
    <ul class="rules">
      <li><b>There are no quills aboard.</b> Nothing on this form can be typed. Ye speak, we write.</li>
      <li><b>There are no buttons either</b> — save the one below, which exists only because yer
        browser demands a click afore it opens the microphone. It does nothin' else.</li>
      <li><b>One question at a time.</b> ${STEPS.length} paces down the plank, and no goin' back.</li>
      <li><b>Ye pass by screamin'.</b> Each question listens for yer answer on its own; once
        somethin's written down, SCREAM to move a pace along. That is the only door.</li>
      <li><b>No blanks.</b> The gate stays shut until ye've answered. Every question, all ${STEPS.length}.</li>
      <li><b>Misspoke?</b> Say <i>"scratch that"</i> (or <i>"start over"</i>, <i>"clear that"</i>) and the line is wiped clean.</li>
      <li><b>For how bad it hurts, scream it out.</b> One second of holler for each point out of ten. Seven seconds is a seven.</li>
    </ul>
    ${canHear ? "" : `<p class="nosupport"><b>Yer browser has no ears.</b> This form takes no typing
       and no clickin' through — without speech recognition there is nothing ye can do here.
       Open it in Chrome or Safari.</p>`}
    <div class="acts">
      <button class="holler" id="begin" ${canHear ? "" : "disabled"}>🎙 Wake the microphone — the only button aboard</button>
    </div>
    <p class="note" id="note"></p>`;
  document.getElementById("begin").addEventListener("click", beginByScream);
  paintPlank();
}

/* The one click in the whole app: it exists only because browsers demand a
 * user gesture afore the microphone opens. It opens the mic (meter live in
 * the HUD) — then a SCREAM, not the click, steps ye onto the plank. */
async function beginByScream() {
  const myGen = ++gen;
  const begin = document.getElementById("begin");
  begin.disabled = true;
  begin.textContent = "🗣 The mic is open — now SCREAM to board";
  note("Watch the gauge above — it shows what the ship hears. SCREAM past the red mark to step onto the plank.");
  while (gen === myGen) {
    const held = await screamer.listen({
      mode: "advance",
      onArmed: () => { if (gen === myGen) note("SCREAM to step onto the plank 🗣"); },
      onFail: (message) => { if (gen === myGen) note(message); },
    });
    if (gen !== myGen) return;
    if (held !== null) { go(0); return; }
    await sleep(RETRY_MS);
  }
}

function renderStep() {
  const step = STEPS[index];
  const isScale = step.kind === "scale";
  const isChoices = step.kind === "choices";

  card.innerHTML = `
    <p class="step-no">Pace ${index + 1} of ${STEPS.length}</p>
    <h1 class="display">${step.q}</h1>
    <p class="plain">${step.plain}${step.say ? ` &middot; <b>${step.say}</b>` : ""}</p>
    ${isScale ? `
      <div class="pips" id="pips"></div>
      <div class="gauge-val" id="gauge">—</div>
      <div class="vu"><span id="vu"></span></div>
    ` : isChoices ? `
      <div class="choices" id="choices"></div>
    ` : `
      <div class="answer empty" id="answer"></div>
    `}
    <p class="note" id="note"></p>
    <p class="gate">${isScale
      ? `<b>This one ye scream.</b> No speakin' needed — hold yer holler one second for every
         point out of ten. The scream both answers the question and carries ye onward.`
      : `<b>Speak yer answer first.</b> The ship is already listenin'. Once somethin's written
         down ye'll be told to SCREAM, and the scream takes the next pace.`}</p>`;

  if (isScale) {
    const pips = document.getElementById("pips");
    for (let i = 1; i <= 10; i++) pips.appendChild(el(`<span class="pip">☠</span>`));
    paintScale(ratings[step.key] ? ratings[step.key].value : 0);
  } else if (isChoices) {
    const box = document.getElementById("choices");
    for (const option of step.options) {
      const pill = el(`<span class="choice">${option}</span>`);
      pill.dataset.option = option;
      box.appendChild(pill);
    }
    paintChoices();
  } else {
    paintAnswer();
  }

  paintGate();
  paintPlank();
}

function note(message) {
  const slot = document.getElementById("note");
  if (slot) slot.textContent = message;
}

/* Has this question actually been answered? No blanks aboard — the scream
 * gate stays shut until there's something written down. */
function answered(step) {
  if (step.kind === "scale") return !!ratings[step.key];
  if (step.kind === "choices") return (chosen[step.key] || []).length > 0;
  return !!(answers[step.key] || "").trim();
}

/* Paint the gate line for the question on screen. There is no button to
 * lock any more — the loop itself refuses to arm the scream on a blank. */
function paintGate() {
  const step = STEPS[index];
  if (!step || step.kind === "scale") return;
  const gate = document.querySelector(".gate");
  if (!gate) return;
  gate.innerHTML = answered(step)
    ? `<b>The gate is open.</b> When the ship says SCREAM, holler and ye take the next pace.
       Speakin' again adds to yer answer; <i>"scratch that"</i> wipes it clean.`
    : `<b>Speak yer answer first.</b> The ship is listenin' — no soul passes this plank on a
       blank. Once somethin's written down, the scream gate arms itself.`;
}

function paintAnswer(interim = "") {
  const slot = document.getElementById("answer");
  if (!slot) return;
  const step = STEPS[index];
  const value = answers[step.key] || "";
  if (!value && !interim) {
    slot.className = "answer empty";
    slot.textContent = step.say || "waitin' on yer voice…";
    return;
  }
  slot.className = "answer";
  slot.textContent = value;
  if (interim) slot.appendChild(el(`<span class="interim"> ${interim}…</span>`));
  if (step.kind === "date" && answers[`${step.key}__heard`]) {
    slot.appendChild(el(`<span class="parsed">heard: “${answers[`${step.key}__heard`]}”</span>`));
  }
}

function paintChoices() {
  const step = STEPS[index];
  const picked = chosen[step.key] || [];
  for (const pill of document.querySelectorAll(".choice")) {
    pill.classList.toggle("on", picked.includes(pill.dataset.option));
  }
}

function paintScale(value) {
  const pips = document.querySelectorAll(".pip");
  pips.forEach((pip, i) => pip.classList.toggle("lit", i < value));
  const gauge = document.getElementById("gauge");
  if (gauge) gauge.innerHTML = value > 0 ? `${value}<span class="of">/10</span>` : "—";
}

/* ---------------- the voice loop: no buttons aboard ---------------- */
/* Every step runs itself: dictation opens on its own, the scream gate arms
 * itself once there's an answer, and a scream takes the pace. `gen` is the
 * generation counter — go() bumps it, so any in-flight loop from an earlier
 * step sees a stale token and dies without firing a stale advance. */
let gen = 0;
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

function isCorrection(heard) {
  return /\b(scratch that|start over|clear that|belay that)\b/.test(normalize(heard));
}

function wipeAnswer(step) {
  delete answers[step.key];
  delete answers[`${step.key}__heard`];
  delete chosen[step.key];
  delete ratings[step.key];
  if (step.kind === "choices") paintChoices();
  else paintAnswer();
}

/* One round of dictation into the current question. */
async function dictateOnce(myGen, step) {
  screamer.stop();                       // one mic, one job — never both at once
  if (gen !== myGen) return;
  const hot = document.getElementById("answer");
  if (hot) hot.classList.add("hot");
  note("openin' the ship's ear…");
  paintMeter({ level: 0, threshold: null, state: "calibrating", label: "🎙 openin' the ship's ear…" });

  const heard = await dictation.listen({
    onOpen: () => {
      if (gen !== myGen) return;
      paintMeter({ level: 0, threshold: null, state: "calibrating", label: "🎙 the ship's ear is open" });
      note(answered(step)
        ? 'Speak to add to yer answer, say "scratch that" to wipe it — or hold yer tongue.'
        : "Speak yer answer now.");
    },
    onInterim: (interim) => { if (gen === myGen) paintAnswer(interim); },
    onFail: (message) => { if (gen === myGen) note(message); },
  });

  if (hot) hot.classList.remove("hot");
  resetMeter();
  if (gen !== myGen) return;
  if (heard) recordSpoken(step, heard);
  else paintAnswer();
  paintGate();
}

/* Hand the mic from dictation to the screamer and wait for a holler.
 * No artificial delay needed — the mic hands over cleanly as long as the
 * two never run at once. */
async function screamToPass(myGen) {
  dictation.stop();
  if (gen !== myGen) return null;
  return screamer.listen({
    mode: "advance",
    onArmed: () => { if (gen === myGen) note("SCREAM NOW to take the next pace 🗣"); },
    onFail: (message) => { if (gen === myGen) note(message); },
  });
}

/* A scale question: the scream is both the answer and the door. */
async function screamScale(myGen, step) {
  dictation.stop();
  const vu = document.getElementById("vu");
  const seconds = await screamer.listen({
    mode: "measure",
    onArmed: () => { if (gen === myGen) note("SCREAM NOW — one second for each point 🗣"); },
    onLevel: (level) => { if (vu) vu.style.width = `${Math.min(100, (level / 0.3) * 100)}%`; },
    onHold: (held) => {
      if (gen !== myGen) return;
      paintScale(Math.min(MAX_SECONDS, Math.max(1, Math.round(held))));
      note(`${held.toFixed(1)}s…`);
    },
    onFail: (message) => { if (gen === myGen) note(message); },
  });
  if (vu) vu.style.width = "0";
  if (gen !== myGen || seconds === null) return false;

  const value = Math.min(MAX_SECONDS, Math.max(1, Math.round(seconds)));
  ratings[step.key] = { value, method: "scream", seconds: Number(seconds.toFixed(1)) };
  paintScale(value);
  note(`Screamed ${seconds.toFixed(1)}s → ${value} out of 10. A pace onward.`);
  await sleep(850);
  if (gen !== myGen) return true;        // the ship moved on without us
  go(index + 1);
  return true;
}

/* The engine for one step: listen, gate, scream, advance — no clicks. */
async function runStep() {
  const myGen = ++gen;
  const step = STEPS[index];

  if (step.kind === "scale") {
    while (gen === myGen) {
      const done = await screamScale(myGen, step);
      if (gen !== myGen || done) return;
      await sleep(RETRY_MS);             // heard naught — arm it again
    }
    return;
  }

  while (gen === myGen) {
    // No blanks: keep listenin' until somethin' is written down.
    while (gen === myGen && !answered(step)) {
      await dictateOnce(myGen, step);
      if (gen !== myGen) return;
      if (!answered(step)) await sleep(RETRY_MS);
    }
    if (gen !== myGen) return;

    // Answered — arm the scream gate.
    const held = await screamToPass(myGen);
    if (gen !== myGen) return;
    if (held !== null) { note("Heard ye. A pace onward."); go(index + 1); return; }

    // No holler came. Back to dictation so they can amend, then re-arm.
    // This alternates forever — no soul is ever stranded without a click.
    await dictateOnce(myGen, step);
    if (gen !== myGen) return;
  }
}

function recordSpoken(step, heard) {
  if (isCorrection(heard)) {
    wipeAnswer(step);
    paintGate();
    note("Scratched clean. Say it anew.");
    return;
  }
  if (step.kind === "choices") {
    const hits = matchChoices(step, heard);
    if (!hits.length) { note(`Nothin' matched “${heard}”. Try again.`); return; }
    chosen[step.key] = step.multi
      ? [...new Set([...(chosen[step.key] || []), ...hits])]
      : [hits[0]];
    paintChoices();
    note(`Marked: ${chosen[step.key].join(", ")}`);
    return;
  }

  if (step.kind === "date") {
    const iso = spokenDate(heard);
    if (!iso) { note(`Couldn't read “${heard}” as a date. Try "June 2nd 1943".`); return; }
    answers[step.key] = iso;
    answers[`${step.key}__heard`] = heard;
    paintAnswer();
    note(`Logged ${iso}.`);
    return;
  }

  answers[step.key] = answers[step.key] ? `${answers[step.key]} ${heard}` : heard;
  paintAnswer();
  note("Written down.");
}

/* ---------------- walking the plank ---------------- */
function go(next) {
  gen++;                               // cancel any in-flight loop for the old step
  dictation.stop();
  screamer.stop();
  if (next >= STEPS.length) { walkOff(); return; }
  index = next;
  renderStep();
  window.scrollTo({ top: 0, behavior: "smooth" });
  runStep();
}

function payload() {
  const body = { ratings };
  for (const step of STEPS) {
    if (step.kind === "scale") continue;
    if (step.kind === "choices") {
      const picked = chosen[step.key] || [];
      body[step.key] = step.multi ? picked : (picked[0] || "");
    } else {
      body[step.key] = answers[step.key] || "";
    }
  }
  body.date = new Date().toISOString().slice(0, 10);
  return body;
}

function screamedSummary() {
  const rows = SCALE_KEYS
    .filter((key) => ratings[key])
    .map((key) => {
      const step = STEPS.find((s) => s.key === key);
      const rating = ratings[key];
      return `<div><span class="k">${step.plain.split("—")[0].trim()}</span>
              <span class="v">${rating.value}/10 <span class="k">(${rating.seconds}s)</span></span></div>`;
    }).join("");
  return rows ? `<div class="summary">${rows}</div>` : "";
}

async function walkOff() {
  if (submitted) return;
  submitted = true;
  index = STEPS.length;
  paintPlank();
  walker.classList.add("falling");

  card.innerHTML = `
    <div class="hero">
      <span class="skull display">🌊</span>
      <h1 class="display">Off the end ye go</h1>
      <p class="plain">Handin' yer articles to the surgeon…</p>
    </div>
    <p class="note" id="note"></p>`;

  const body = payload();
  if (!body.name) {
    walker.classList.remove("falling");
    submitted = false;
    const nameStep = STEPS.findIndex((s) => s.key === "name");
    index = nameStep;
    renderStep();
    note("We'll not treat a soul with no name. Back ye go — speak it.");
    runStep();
    return;
  }

  try {
    const response = await fetch("/api/intake", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || "The sea swallowed it.");

    card.innerHTML = `
      <div class="hero">
        <span class="skull display">☠</span>
        <h1 class="display">Aye, ${result.name}</h1>
        <p class="plain">Logged as soul #${result.id}. The surgeon will see ye below deck.</p>
      </div>
      ${screamedSummary()}
      <p class="gate"><b>No button here either.</b> The ship is still listenin' —
        say <i>"another soul"</i> and the articles reset for the next patient.</p>
      <p class="note" id="note"></p>`;
    listenForAnotherSoul();
  } catch (error) {
    submitted = false;
    walker.classList.remove("falling");
    card.innerHTML = `
      <div class="hero">
        <span class="skull display">🌊</span>
        <h1 class="display">The sea took it</h1>
        <p class="plain">${error.message}</p>
      </div>
      <p class="gate"><b>SCREAM to haul it up again.</b> No button for this either.</p>
      <p class="note" id="note"></p>`;
    retryByScream();
  }
}

/* End card: no button — the mic stays open for "another soul". */
async function listenForAnotherSoul() {
  const myGen = ++gen;
  screamer.stop();
  while (gen === myGen) {
    const heard = await dictation.listen({ onFail: () => {} });
    if (gen !== myGen) return;
    if (heard && /\b(another soul|another one|next soul|next patient|start again|restart)\b/.test(normalize(heard))) {
      gen++;
      dictation.stop();
      for (const key of Object.keys(answers)) delete answers[key];
      for (const key of Object.keys(chosen)) delete chosen[key];
      for (const key of Object.keys(ratings)) delete ratings[key];
      submitted = false;
      walker.classList.remove("falling");
      index = -1;
      renderIntro();
      return;
    }
    if (heard) note(`Heard “${heard}” — say "another soul" to ready the articles anew.`);
    await sleep(RETRY_MS);
  }
}

/* Submit failed: a scream sends it again. */
async function retryByScream() {
  const myGen = ++gen;
  dictation.stop();
  while (gen === myGen) {
    const held = await screamer.listen({
      mode: "advance",
      onArmed: () => { if (gen === myGen) note("SCREAM to send yer articles again 🗣"); },
      onFail: (message) => { if (gen === myGen) note(message); },
    });
    if (gen !== myGen) return;
    if (held !== null) { index = STEPS.length - 1; walkOff(); return; }
    await sleep(RETRY_MS);
  }
}

/* No quills aboard: there is nothing typeable on this page, but if they try
 * a key anyway, say so plainly. */
document.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  if (["Tab", "Enter", " ", "Escape"].includes(event.key)) return;
  if (event.key.length !== 1) return;
  event.preventDefault();
  note("No quills aboard — speak it, then scream.");
});

renderIntro();
</script>
</body>
</html>
