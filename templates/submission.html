{% extends "base.html" %}

{% block content %}
<article>
  <header>
    <h2>Submission Received</h2>
  </header>

  <p><strong>Patient Name:</strong> {{ data.name }}</p>
  <p><strong>Date:</strong> {{ data.date }}</p>
  <p><strong>Date of Birth:</strong> {{ data.date_of_birth }}</p>
  <p><strong>Phone:</strong> {{ data.phone }}</p>
  <p><strong>Reason for Visit:</strong> {{ data.reason_for_visit }}</p>

  <h3>JSON Output</h3>
  <pre><code>{{ json_output }}</code></pre>

  <footer>
    <a href="{{ url_for('index') }}" role="button">Back to Form</a>
  </footer>
</article>
{% endblock %}
