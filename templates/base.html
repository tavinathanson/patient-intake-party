<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Patient Intake Form{% endblock %}</title>
  
  <!-- Pico CSS v2 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="container">
    <nav>
      <ul>
        <li><strong>Patient Intake Form</strong></li>
      </ul>
      <ul>
        <li><a href="{{ url_for('index') }}" class="secondary">Clear</a></li>
        <li><a href="{{ url_for('index', prefill='fig') }}" role="button" class="outline">Prefill Sample</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
