<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Persistent Pain Intake Form{% endblock %}</title>
  
  <!-- Pico CSS v2 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  
  <!-- Custom Overrides & Helpers -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <!-- Navigation / Header -->
  <header class="container header-container">
    <nav>
      <ul>
        <li>
          <strong><a href="{{ url_for('index') }}" class="contrast brand-title">🩺 Persistent Pain Intake</a></strong>
        </li>
      </ul>
      <ul>
        <li><a href="{{ url_for('index') }}" class="secondary">Blank Form</a></li>
        <li>
          <a href="{{ url_for('index', prefill='fig') }}" role="button" class="outline btn-sm">Load Fig Turnip (Sample)</a>
        </li>
      </ul>
    </nav>
  </header>

  <!-- Main Content Container -->
  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="container footer-container">
    <hr>
    <div class="footer-content">
      <small>
        Persistent Pain Patient Intake &bull; Built with Flask, uv, &amp; Pico CSS
      </small>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
