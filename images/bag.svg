<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240"><defs><style>path:not([stroke]),ellipse,circle,rect{stroke:#3a2a1d;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}.bg,.bg *{stroke:none}</style>
