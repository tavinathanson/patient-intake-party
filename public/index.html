<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4efe3">
  <meta name="description" content="An offline patient intake guessing game. Four mysteries, 100 preset suspects each, and one overconfident detective. No login required.">
  <title>Intake Investigations — A case of you</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='5' fill='%23d94b2d'/%3E%3Ccircle cx='17' cy='16' r='9' fill='none' stroke='%23f4efe3' stroke-width='3'/%3E%3Cpath d='m24 23 9 10' stroke='%23f4efe3' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to investigation</a>
  <div class="site-shell">
    <header class="masthead">
      <a class="brand" href="/" aria-label="Intake Investigations home">
        <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="20" cy="20" r="12"/><path d="m29 29 12 12M20 12v16M12 20h16"/></svg></span>
        <span>INTAKE<br>INVESTIGATIONS<span class="brand-period">.</span></span>
      </a>
      <div class="masthead-motto">SMALL DETAILS.<br><span>UNREASONABLY BIG CASES.</span></div>
      <button class="transcript-toggle" id="transcript-toggle" type="button" aria-controls="transcript-dialog"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h10v14H5zM8 7h4M8 10h4M8 13h2"/></svg>Witness transcript<span id="transcript-count">0</span></button>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="site-footer"><span>INTAKE INVESTIGATIONS <span aria-hidden="true">©</span> <span id="year"></span></span><span>A LITTLE INTUITION. A LOT OF PAPERWORK.</span><span class="footer-dot">A LOCAL EXPERIMENT</span></footer>
  </div>
  <div id="status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <dialog id="transcript-dialog" class="transcript-dialog" aria-labelledby="transcript-title">
    <div class="drawer-header"><div><span class="eyebrow">FOR THE RECORD</span><h2 id="transcript-title">Witness transcript</h2></div><button class="icon-button" id="close-transcript" type="button" aria-label="Close transcript">×</button></div>
    <div class="transcript-content" id="transcript-content"></div>
    <p class="drawer-footnote">Every yes, no, and noncommittal shrug. All on record.</p>
  </dialog>
</body>
</html>
