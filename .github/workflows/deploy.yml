# Every branch except main deploys to Fly at https://intake-<branch>.fly.dev
# The app is built with Railpack (https://railpack.com), which detects the stack from the files present.
# Needs repo secret FLY_API_TOKEN (an org token). Optional: FLY_ORG variable.
name: deploy
on:
  push:
    branches-ignore: [main]
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - uses: docker/setup-buildx-action@v3
      - run: curl -sSL https://railpack.com/install.sh | sh
      - run: |
          slug=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g; s/--*/-/g; s/^-//; s/-$//' | cut -c1-22)
          app="intake-$slug"
          image="registry.fly.io/$app:$GITHUB_SHA"
          flyctl apps create "$app" --org "${{ vars.FLY_ORG || 'personal' }}" || true
          flyctl auth docker
          railpack prepare . --plan-out plan.json
          docker buildx build --build-arg BUILDKIT_SYNTAX=ghcr.io/railwayapp/railpack-frontend -f plan.json --push -t "$image" .
          flyctl deploy --app "$app" --image "$image" --ha=false
          echo "### 🎉 https://$app.fly.dev" >> "$GITHUB_STEP_SUMMARY"
